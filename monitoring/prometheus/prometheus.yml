global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  - job_name: nomat-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
