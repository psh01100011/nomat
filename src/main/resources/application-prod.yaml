spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-migration-naming: true

logging:
  level:
    root: INFO
    com.dogdog.nomat: INFO
    org.hibernate: WARN
    org.springframework: WARN

app:
  audio-processing:
    enabled: ${AUDIO_PROCESSING_ENABLED:true}
