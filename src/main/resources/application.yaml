spring:
  application:
    name: nomat
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s

server:
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    root: INFO
    com.dogdog.nomat: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level requestId=%X{requestId:-none} logger=%logger{36} message=%msg%n%ex"

app:
  admin:
    api-key: ${ADMIN_API_KEY:}
  email-verification:
    delivery-mode: ${EMAIL_DELIVERY_MODE:smtp}
    mail-from: ${MAIL_FROM:${GMAIL_USERNAME:no-reply@nomat.local}}
    code-validity-minutes: 10
    completion-token-validity-minutes: 30
    max-verification-attempts: 5
    max-sends-per-email-hour: 10
    max-sends-per-ip-hour: 20
  asset:
    cleanup:
      enabled: true
      temp-retention-hours: 24
      orphan-retention-hours: 168
      batch-size: 100
      scan-batch-size: 500
      initial-delay-ms: 60000
      fixed-delay-ms: 3600000
      lock-ttl-minutes: 30
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL}
      image-prefix: uploads/images
      audio-prefix: uploads/audios
      max-image-size-bytes: 10485760
  audio-processing:
    enabled: false
    batch-size: 5
    initial-delay-ms: 10000
    fixed-delay-ms: 30000
    command-timeout-seconds: 300
    processing-timeout-minutes: 10
    delayed-threshold-minutes: ${AUDIO_PROCESSING_DELAYED_THRESHOLD_MINUTES:30}
    max-retry-attempts: 3
    yt-dlp-path: ${YT_DLP_PATH:yt-dlp}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    output-bitrate: ${AUDIO_OUTPUT_BITRATE:128k}
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    jwt:
      issuer: nomat
      secret: ${JWT_SECRET:nomat-local-development-secret-key-32}
      access-token-validity-seconds: 1800
      refresh-token-validity-seconds: 1209600
      password-verification-token-validity-seconds: 300
