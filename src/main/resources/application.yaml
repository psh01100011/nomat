spring:
  application:
    name: nomat
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s

server:
  servlet:
    context-path: /api

app:
  asset:
    cleanup:
      enabled: true
      temp-retention-hours: 24
      batch-size: 100
      initial-delay-ms: 60000
      fixed-delay-ms: 3600000
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL}
      image-prefix: uploads/images
      audio-prefix: uploads/audios
      max-image-size-bytes: 10485760
  audio-processing:
    enabled: false
    batch-size: 5
    initial-delay-ms: 10000
    fixed-delay-ms: 30000
    command-timeout-seconds: 300
    processing-timeout-minutes: 10
    max-retry-attempts: 3
    yt-dlp-path: ${YT_DLP_PATH:yt-dlp}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    output-bitrate: ${AUDIO_OUTPUT_BITRATE:128k}
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    jwt:
      issuer: nomat
      secret: ${JWT_SECRET:nomat-local-development-secret-key-32}
      access-token-validity-seconds: 1800
      refresh-token-validity-seconds: 1209600
      password-verification-token-validity-seconds: 300
