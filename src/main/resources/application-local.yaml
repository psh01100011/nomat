spring:
  datasource:
    url: jdbc:mysql://localhost:3307/nomat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: nomat
    password: nomat
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-migration-naming: true
  data:
    redis:
      url: redis://localhost:6379

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  metrics:
    tags:
      environment: local

logging:
  level:
    com.dogdog.nomat: DEBUG

app:
  email-verification:
    delivery-mode: ${EMAIL_DELIVERY_MODE:smtp}
  asset:
    cleanup:
      enabled: false
    s3:
      bucket: ${AWS_S3_BUCKET}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL}
  audio-processing:
    enabled: true
    worker-concurrency: 4
