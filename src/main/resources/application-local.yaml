spring:
  datasource:
    url: jdbc:mysql://localhost:3307/nomat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: nomat
    password: nomat
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  data:
    redis:
      url: redis://localhost:6379

logging:
  level:
    com.dogdog.nomat: DEBUG

app:
  email-verification:
    delivery-mode: ${EMAIL_DELIVERY_MODE:smtp}
  asset:
    cleanup:
      enabled: false
    s3:
      bucket: ${AWS_S3_BUCKET}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL}
  audio-processing:
    enabled: false
