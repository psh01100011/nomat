services:
  mysql:
    image: mysql:8.4
    container_name: nomat-mysql
    environment:
      MYSQL_DATABASE: nomat
      MYSQL_USER: nomat
      MYSQL_PASSWORD: nomat
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - nomat-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -unomat -pnomat --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    container_name: nomat-redis
    ports:
      - "6379:6379"
    volumes:
      - nomat-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nomat-mysql-data:
  nomat-redis-data:
